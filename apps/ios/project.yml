name: VoiceAgentBridge
options:
  bundleIdPrefix: hk.knockknock
  deploymentTarget:
    iOS: "15.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
packages:
  LiteRTLM:
    path: ThirdParty/LiteRTLM
  MLXSwift:
    url: https://github.com/ml-explore/mlx-swift
    exactVersion: 0.31.4
  MLXSwiftLM:
    url: https://github.com/ml-explore/mlx-swift-lm
    exactVersion: 3.31.4
  SwiftTransformers:
    url: https://github.com/huggingface/swift-transformers
    exactVersion: 1.3.3
  SherpaOnnx:
    url: https://github.com/k2-fsa/sherpa-onnx
    exactVersion: 1.13.5
configs:
  Debug: debug
  Staging: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "25"
    KNOCK_API_BASE_URL: ""
    KNOCK_MODEL_PUBLIC_KEY_BASE64: ""
    APS_ENVIRONMENT: development
  configs:
    Staging:
      KNOCK_API_BASE_URL: "https://knock-knock-backend-staging.wch-klaus.workers.dev"
      APS_ENVIRONMENT: development
    Release:
      CODE_SIGN_IDENTITY: "Apple Distribution"
      KNOCK_API_BASE_URL: "https://knock-knock-backend-production.wch-klaus.workers.dev"
      APS_ENVIRONMENT: production
targets:
  VoiceAgentBridge:
    type: application
    platform: iOS
    sources:
      - path: VoiceAgentBridge
    dependencies:
      - package: LiteRTLM
      - target: KnockKnockMemoryShadow
        embed: true
        codeSign: true
        link: false
    postBuildScripts:
      - name: Copy E5 weights for Debug shadow
        basedOnDependencyAnalysis: false
        script: |
          if [ "${CONFIGURATION}" = "Release" ]; then
            exit 0
          fi
          SRC="${SRCROOT}/VoiceAgentBridgeMLXTests/LocalModels/e5-small"
          if [ ! -d "${SRC}" ]; then
            exit 0
          fi
          DEST="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/e5-small"
          mkdir -p "${DEST}"
          rsync -a "${SRC}/" "${DEST}/"
      - name: Strip MLX shadow framework from Release
        basedOnDependencyAnalysis: false
        script: |
          if [ "${CONFIGURATION}" = "Release" ]; then
            rm -rf "${TARGET_BUILD_DIR}/${FRAMEWORKS_FOLDER_PATH}/KnockKnockMemoryShadow.framework"
          fi
    preBuildScripts:
      - name: Validate Release Voice Model Trust Key
        basedOnDependencyAnalysis: false
        script: |
          "${SRCROOT}/../../scripts/validate-ios-release-model-key.sh"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: hk.knockknock.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: VoiceAgentBridge/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        DEVELOPMENT_TEAM: TXKDW2YS44
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: VoiceAgentBridge/VoiceAgentBridge.entitlements
      configs:
        Debug:
          # Late Bundle.load of this iOS 17 MLX framework hangs loadContainer on
          # device. Weak-link so dyld initializes MLX at process start on iOS 17+,
          # matching the working XCTest host. Release must not link; the
          # post-build script still strips the embedded framework.
          OTHER_LDFLAGS: $(inherited) -weak_framework KnockKnockMemoryShadow
        Staging:
          CODE_SIGN_IDENTITY: "Apple Development"
          OTHER_LDFLAGS: $(inherited) -weak_framework KnockKnockMemoryShadow
        Release:
          CODE_SIGN_IDENTITY: "Apple Distribution"
      entitlements:
        path: VoiceAgentBridge/VoiceAgentBridge.entitlements
    scheme:
      testTargets:
        - VoiceAgentBridgeTests
        - VoiceAgentBridgeUITests
      environmentVariables:
        KNOCK_UI_TEST_API_BASE_URL: "$(KNOCK_API_BASE_URL)"
        KNOCK_RUN_AIRPLANE_MODE_UAT: "$(KNOCK_RUN_AIRPLANE_MODE_UAT)"
        KNOCK_AIRPLANE_PHASE: "$(KNOCK_AIRPLANE_PHASE)"
        KNOCK_AIRPLANE_EXPECTED_SESSION_TITLE: "$(KNOCK_AIRPLANE_EXPECTED_SESSION_TITLE)"
        KNOCK_AIRPLANE_COUNTDOWN_SECONDS: "$(KNOCK_AIRPLANE_COUNTDOWN_SECONDS)"
        KNOCK_FORCE_UNREACHABLE_ROUTE_UAT: "$(KNOCK_FORCE_UNREACHABLE_ROUTE_UAT)"
        KNOCK_RUN_DUAL_DEVICE_UAT: "$(KNOCK_RUN_DUAL_DEVICE_UAT)"
        KNOCK_RUN_PHYSICAL_VOICE_E2E: "$(KNOCK_RUN_PHYSICAL_VOICE_E2E)"
        KNOCK_PHYSICAL_VOICE_MANUAL_CAPTURE: "$(KNOCK_PHYSICAL_VOICE_MANUAL_CAPTURE)"
        KNOCK_PHYSICAL_VOICE_EXPECTATION_MODE: "$(KNOCK_PHYSICAL_VOICE_EXPECTATION_MODE)"
        KNOCK_EXPECTED_VOICE_RUNTIME: "$(KNOCK_EXPECTED_VOICE_RUNTIME)"
        KNOCK_PHYSICAL_VOICE_COUNTDOWN_SECONDS: "$(KNOCK_PHYSICAL_VOICE_COUNTDOWN_SECONDS)"
        KNOCK_PHYSICAL_VOICE_HOLD_SECONDS: "$(KNOCK_PHYSICAL_VOICE_HOLD_SECONDS)"
        KNOCK_RUN_VOICE_AUDIO_STT_UAT: "$(KNOCK_RUN_VOICE_AUDIO_STT_UAT)"
        KNOCK_RUN_VOICE_AUDIO_PIPELINE_UAT: "$(KNOCK_RUN_VOICE_AUDIO_PIPELINE_UAT)"
        KNOCK_RUN_PUBLIC_STT_APPLE_UAT: "$(KNOCK_RUN_PUBLIC_STT_APPLE_UAT)"
        KNOCK_CLEAN_PUBLIC_STT_APPLE_UAT: "$(KNOCK_CLEAN_PUBLIC_STT_APPLE_UAT)"
        KNOCK_PUBLIC_STT_APPLE_BACKEND: "$(KNOCK_PUBLIC_STT_APPLE_BACKEND)"
        KNOCK_VOICE_AUDIO_DATASET_ROOT: "$(KNOCK_VOICE_AUDIO_DATASET_ROOT)"
        KNOCK_VOICE_AUDIO_HUMAN_SUBSET_ONLY: "$(KNOCK_VOICE_AUDIO_HUMAN_SUBSET_ONLY)"
        KNOCK_VOICE_AUDIO_IDS: "$(KNOCK_VOICE_AUDIO_IDS)"
        KNOCK_VOICE_AUDIO_LIMIT: "$(KNOCK_VOICE_AUDIO_LIMIT)"
        KNOCK_VOICE_AUDIO_PROFILES: "$(KNOCK_VOICE_AUDIO_PROFILES)"
        KNOCK_VOICE_AUDIO_REPEAT_COUNT: "$(KNOCK_VOICE_AUDIO_REPEAT_COUNT)"
        KNOCK_VOICE_RESULT_DEVICE: "$(KNOCK_VOICE_RESULT_DEVICE)"
        KNOCK_VOICE_STT_BACKEND: "$(KNOCK_VOICE_STT_BACKEND)"
        KNOCK_VOICE_USE_GPU: "$(KNOCK_VOICE_USE_GPU)"

  VoiceAgentBridgeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: VoiceAgentBridgeTests
    dependencies:
      - target: VoiceAgentBridge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: hk.knockknock.app.tests
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: TXKDW2YS44

  VoiceAgentBridgeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: VoiceAgentBridgeUITests
    dependencies:
      - target: VoiceAgentBridge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: hk.knockknock.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: TXKDW2YS44

  KnockKnockMemoryShadow:
    type: framework
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: KnockKnockMemoryShadow
    dependencies:
      - package: MLXSwift
        product: MLX
      - package: MLXSwiftLM
        product: MLXEmbedders
      - package: MLXSwiftLM
        product: MLXLMCommon
      - package: MLXSwiftLM
        product: MLXHuggingFace
      - package: SwiftTransformers
        product: Tokenizers
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: hk.knockknock.app.memory-shadow
        GENERATE_INFOPLIST_FILE: YES
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
        DEVELOPMENT_TEAM: TXKDW2YS44

  VoiceAgentBridgeSenseVoiceTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: VoiceAgentBridgeSenseVoiceTests
    dependencies:
      - target: VoiceAgentBridge
      - package: SherpaOnnx
        product: sherpa-onnx
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: hk.knockknock.app.sensevoice-tests
        GENERATE_INFOPLIST_FILE: YES
        IPHONEOS_DEPLOYMENT_TARGET: "15.0"
        DEVELOPMENT_TEAM: TXKDW2YS44

  VoiceAgentBridgeMLXTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: VoiceAgentBridgeMLXTests
        excludes:
          - LocalModels
      - path: VoiceAgentBridgeMLXTests/LocalModels
        type: folder
        buildPhase: resources
      - path: VoiceAgentBridgeTests/Fixtures/VoiceCommandGoldenSet.v1.json
        buildPhase: resources
    dependencies:
      - target: VoiceAgentBridge
      - target: KnockKnockMemoryShadow
      - package: MLXSwift
        product: MLX
      - package: MLXSwiftLM
        product: MLXEmbedders
      - package: MLXSwiftLM
        product: MLXLLM
      - package: MLXSwiftLM
        product: MLXLMCommon
      - package: MLXSwiftLM
        product: MLXHuggingFace
      - package: SwiftTransformers
        product: Tokenizers
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: hk.knockknock.app.mlx-tests
        GENERATE_INFOPLIST_FILE: YES
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        DEVELOPMENT_TEAM: TXKDW2YS44

  VoiceAgentBridgeGemma4Tests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: VoiceAgentBridgeMLXTests
        excludes:
          - LocalModels
      - path: VoiceAgentBridgeMLXTests/LocalModels
        type: folder
        buildPhase: resources
      - path: VoiceAgentBridgeTests/Fixtures/VoiceCommandGoldenSet.v1.json
        buildPhase: resources
    dependencies:
      - target: VoiceAgentBridge
      - target: KnockKnockMemoryShadow
      - package: MLXSwift
        product: MLX
      - package: MLXSwiftLM
        product: MLXEmbedders
      - package: MLXSwiftLM
        product: MLXLLM
      - package: MLXSwiftLM
        product: MLXLMCommon
      - package: MLXSwiftLM
        product: MLXHuggingFace
      - package: SwiftTransformers
        product: Tokenizers
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: hk.knockknock.app.gemma4-tests
        GENERATE_INFOPLIST_FILE: YES
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        DEVELOPMENT_TEAM: TXKDW2YS44

schemes:
  VoiceAgentBridgeSenseVoiceQualification:
    build:
      targets:
        VoiceAgentBridge: all
        VoiceAgentBridgeSenseVoiceTests: [test]
    test:
      targets:
        - name: VoiceAgentBridgeSenseVoiceTests
          parallelizable: false
      environmentVariables:
        KNOCK_RUN_SENSEVOICE_UAT: "$(KNOCK_RUN_SENSEVOICE_UAT)"
        KNOCK_SENSEVOICE_AUDIO_FILES: "$(KNOCK_SENSEVOICE_AUDIO_FILES)"
        KNOCK_SENSEVOICE_LANGUAGE: "$(KNOCK_SENSEVOICE_LANGUAGE)"
        KNOCK_SENSEVOICE_NUM_THREADS: "$(KNOCK_SENSEVOICE_NUM_THREADS)"
        KNOCK_SENSEVOICE_DELETE_UAT_DATA: "$(KNOCK_SENSEVOICE_DELETE_UAT_DATA)"

  VoiceAgentBridgeMLXQualification:
    build:
      targets:
        VoiceAgentBridge: all
        VoiceAgentBridgeMLXTests: [test]
    test:
      targets:
        - name: VoiceAgentBridgeMLXTests
          parallelizable: false
      environmentVariables:
        KNOCK_RUN_MLX_BENCHMARK: "$(KNOCK_RUN_MLX_BENCHMARK)"
        KNOCK_MLX_EMBEDDER_DIR: "$(KNOCK_MLX_EMBEDDER_DIR)"
        KNOCK_MLX_GEMMA_DIR: "$(KNOCK_MLX_GEMMA_DIR)"
        KNOCK_MLX_GEMMA_MODEL_ID: "$(KNOCK_MLX_GEMMA_MODEL_ID)"
        KNOCK_MLX_GOLDEN_LOCALES: "$(KNOCK_MLX_GOLDEN_LOCALES)"
        KNOCK_ALLOW_MLX_SIMULATOR_DIAGNOSTIC: "$(KNOCK_ALLOW_MLX_SIMULATOR_DIAGNOSTIC)"

  VoiceAgentBridgeGemma4Qualification:
    build:
      targets:
        VoiceAgentBridge: all
        VoiceAgentBridgeGemma4Tests: [test]
    test:
      targets:
        - name: VoiceAgentBridgeGemma4Tests
          parallelizable: false
      environmentVariables:
        KNOCK_RUN_MLX_BENCHMARK: "$(KNOCK_RUN_MLX_BENCHMARK)"
        KNOCK_MLX_EMBEDDER_DIR: "$(KNOCK_MLX_EMBEDDER_DIR)"
        KNOCK_MLX_GEMMA_DIR: "$(KNOCK_MLX_GEMMA_DIR)"
        KNOCK_MLX_GEMMA_MODEL_ID: "mlx-community/gemma-4-e2b-it-4bit"
        KNOCK_MLX_GOLDEN_LOCALES: "$(KNOCK_MLX_GOLDEN_LOCALES)"
        KNOCK_ALLOW_MLX_SIMULATOR_DIAGNOSTIC: "$(KNOCK_ALLOW_MLX_SIMULATOR_DIAGNOSTIC)"
