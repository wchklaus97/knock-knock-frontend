openapi: 3.1.0
info:
  title: Voice Agent Bridge API
  version: 0.1.0
  description: |
    HTTP API for Voice Agent Bridge (VAB).

    **Security**
    - `UserBearer` — JWT from `/v1/auth/register` or `/v1/auth/login`
    - `AgentKey` — header `X-Agent-Key` (per-agent key from create/pairing claim)

    **Push semantics**
    - `POST /v1/sessions/{id}/progress` (**update_progress**) NEVER pushes
    - `POST /v1/sessions/{id}/events` (**report_event**) MAY push for `needs_user`,
      or `succeeded`/`failed` with `actions` / `force_push`
    - Agent decides `needs_user`; the bridge does not guess

    **TTL**
    - Session default max 24h (`86400`)
    - Destructive confirm window max 30m (`1800`)

servers:
  - url: http://127.0.0.1:8787
    description: Local MVP

tags:
  - name: health
  - name: auth
  - name: agents
  - name: pairing
  - name: skills
  - name: sessions
  - name: actions
  - name: phone
  - name: dev

paths:
  /health:
    get:
      tags: [health]
      operationId: getHealth
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean, const: true }

  /metrics:
    get:
      tags: [health]
      operationId: getMetrics
      summary: Prometheus-compatible operator metrics
      security: []
      responses:
        "200":
          description: Metrics text
          content:
            text/plain:
              schema: { type: string }

  /v1/auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: Register a user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthCredentials"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenResponse"
        "409":
          $ref: "#/components/responses/Error"

  /v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Login and obtain JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthCredentials"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenResponse"
        "401":
          $ref: "#/components/responses/Error"

  /v1/auth/refresh:
    post:
      tags: [auth]
      operationId: refresh
      summary: Rotate a refresh token and issue a new access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        "200":
          description: Rotated token pair
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthTokenResponse" }
        "401": { $ref: "#/components/responses/Error" }

  /v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Revoke a refresh token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        "200":
          description: Revoked

  /v1/agents:
    get:
      tags: [agents]
      operationId: listAgents
      summary: List agents for the authenticated user
      security:
        - UserBearer: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [agents]
                properties:
                  agents:
                    type: array
                    items:
                      $ref: "#/components/schemas/Agent"
    post:
      tags: [agents]
      operationId: createAgent
      summary: Create an agent; returns api_key once
      security:
        - UserBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label]
              additionalProperties: false
              properties:
                label: { type: string, minLength: 1 }
                host_label: { type: string }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentCreated"

  /v1/agents/{agent_id}/rotate-key:
    post:
      tags: [agents]
      operationId: rotateAgentKey
      summary: Revoke the current agent key and issue a replacement
      security:
        - UserBearer: []
      parameters:
        - name: agent_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Replacement key, shown only once
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentCreated" }

  /v1/pairing/code:
    post:
      tags: [pairing]
      operationId: createPairingCode
      summary: Create a short-lived pairing code
      security:
        - UserBearer: []
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [code, expires_at]
                properties:
                  code: { type: string }
                  expires_at: { type: string }

  /v1/pairing/claim:
    post:
      tags: [pairing]
      operationId: claimPairingCode
      summary: Claim pairing code; creates agent + api_key (public)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, label]
              additionalProperties: false
              properties:
                code: { type: string }
                label: { type: string, minLength: 1 }
                host_label: { type: string }
      responses:
        "201":
          description: Agent created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentCreated"
        "400":
          $ref: "#/components/responses/Error"

  /v1/skills:
    get:
      tags: [skills]
      operationId: listSkills
      summary: List skills
      security:
        - UserBearer: []
        - AgentKey: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [skills]
                properties:
                  skills:
                    type: array
                    items:
                      $ref: "#/components/schemas/Skill"
    post:
      tags: [skills]
      operationId: upsertSkill
      summary: Create or upsert a skill
      security:
        - UserBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Skill"
      responses:
        "200":
          description: Upserted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Skill"

  /v1/sessions:
    post:
      tags: [sessions]
      operationId: createOrResumeSession
      summary: Create or resume a session (agent)
      description: Session is created when the agent calls this with `skill_id`.
      security:
        - AgentKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [skill_id]
              additionalProperties: false
              properties:
                skill_id: { type: string }
                session_id: { type: string }
                idempotency_key: { type: string }
                chat_id: { type: string }
                title: { type: string }
                facts:
                  type: object
                  additionalProperties: true
                metadata:
                  type: object
                  additionalProperties: true
      responses:
        "200":
          description: Created or resumed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "404":
          $ref: "#/components/responses/Error"

  /v1/sessions/{session_id}:
    get:
      tags: [sessions]
      operationId: getSession
      summary: Get session by id
      security:
        - AgentKey: []
        - UserBearer: []
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "404":
          $ref: "#/components/responses/Error"

  /v1/sessions/{session_id}/progress:
    post:
      tags: [sessions]
      operationId: updateProgress
      summary: Update progress (NEVER pushes)
      description: |
        **CRITICAL:** NEVER triggers a push. Use report_event to notify the user.
      security:
        - AgentKey: []
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              additionalProperties: false
              properties:
                status:
                  $ref: "#/components/schemas/ProgressStatus"
                message:
                  type: string
                  maxLength: 280
                percent:
                  type: number
                  minimum: 0
                  maximum: 100
                  description: Optional truthful estimate; omit when unknown.
      responses:
        "200":
          description: Progress mirrored; no push enqueued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "409":
          $ref: "#/components/responses/Error"

  /v1/sessions/{session_id}/events:
    post:
      tags: [sessions]
      operationId: reportEvent
      summary: Report event (MAY push)
      description: |
        MAY push for `needs_user` (always), or `succeeded`/`failed` when `actions`
        are present or `force_push` is true. Idempotent via `idempotency_key`.
        `needs_user` requires non-empty `actions` (skill action id strings).
      security:
        - AgentKey: []
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportEventRequest"
      responses:
        "200":
          description: Event recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportEventResponse"
        "400":
          $ref: "#/components/responses/Error"

  /v1/sessions/{session_id}/actions/pending:
    get:
      tags: [actions]
      operationId: getSessionPendingActions
      summary: List/claim queued actions for a session
      security:
        - AgentKey: []
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/Claim"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingActionsResponse"

  /v1/agents/me/actions/pending:
    get:
      tags: [actions]
      operationId: getAgentPendingActions
      summary: List/claim queued actions for this agent
      security:
        - AgentKey: []
      parameters:
        - $ref: "#/components/parameters/Claim"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingActionsResponse"

  /v1/actions/{action_id}/result:
    post:
      tags: [actions]
      operationId: submitActionResult
      summary: Submit result after executing a claimed action
      security:
        - AgentKey: []
      parameters:
        - name: action_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ok]
              additionalProperties: false
              properties:
                ok: { type: boolean }
                message: { type: string }
                output:
                  type: object
                  additionalProperties: true
      responses:
        "200":
          description: Result accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Action"

  /v1/phone/sessions:
    get:
      tags: [phone]
      operationId: listPhoneSessions
      summary: List non-closed sessions for the phone user
      security:
        - UserBearer: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [sessions]
                properties:
                  sessions:
                    type: array
                    items:
                      $ref: "#/components/schemas/Session"

  /v1/phone/sessions/{session_id}/history:
    get:
      tags: [phone]
      operationId: listSessionHistory
      summary: List the auditable lifecycle of one session
      security:
        - UserBearer: []
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
      responses:
        "200":
          description: Audit timeline
          content:
            application/json:
              schema:
                type: object
                required: [entries]
                properties:
                  entries:
                    type: array
                    items: { $ref: "#/components/schemas/HistoryEntry" }

  /v1/phone/devices:
    post:
      tags: [phone]
      operationId: registerPhoneDevice
      summary: Register a device for push (dev mode stores token)
      security:
        - UserBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [platform, push_token]
              additionalProperties: false
              properties:
                platform:
                  type: string
                  enum: [ios, ios_simulator, mac_dev]
                push_token: { type: string }
                locale:
                  type: string
                  default: zh-Hans
      responses:
        "200":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"

  /v1/phone/sessions/{session_id}/reply:
    post:
      tags: [phone]
      operationId: replyPhoneSession
      summary: User selects a skill action from the phone
      description: |
        - low risk → action `queued`, session `queued`
        - destructive / confirm → action `pending_confirm`, session `awaiting_confirm`
          until `/confirm`
        - `confirm: false` records the phone cancellation as an agent-claimable
          queued action with `cancelled_by_user: true`.
      security:
        - UserBearer: []
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action_key]
              additionalProperties: false
              properties:
                action_key:
                  type: string
                  description: Skill action id (e.g. rollback, ack)
                utterance: { type: string }
      responses:
        "200":
          description: Reply accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhoneActionResponse"

  /v1/phone/sessions/{session_id}/confirm:
    post:
      tags: [phone]
      operationId: confirmPhoneSession
      summary: Second confirmation for destructive / confirm-required actions
      security:
        - UserBearer: []
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action_id, confirm]
              additionalProperties: false
              properties:
                action_id: { type: string }
                confirm: { type: boolean }
      responses:
        "200":
          description: Confirmation applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhoneActionResponse"
        "409":
          $ref: "#/components/responses/Error"

  /v1/dev/pushes:
    get:
      tags: [dev]
      operationId: listDevPushes
      summary: Dev push inbox (no real APNs when PUSH_MODE=dev)
      security:
        - UserBearer: []
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: Recent captured pushes for the user
          content:
            application/json:
              schema:
                type: object
                required: [pushes]
                properties:
                  pushes:
                    type: array
                    items:
                      $ref: "#/components/schemas/DevPush"

components:
  securitySchemes:
    UserBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: User JWT from /v1/auth/register or /v1/auth/login
    AgentKey:
      type: apiKey
      in: header
      name: X-Agent-Key
      description: Per-agent API key from agent create or pairing claim

  parameters:
    SessionId:
      name: session_id
      in: path
      required: true
      schema: { type: string }
    Claim:
      name: claim
      in: query
      description: When not "false", claim queued actions (default true)
      schema: { type: boolean, default: true }

  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    ProgressStatus:
      type: string
      enum: [started, running, blocked, succeeded, failed, cancelled]
      description: Progress update status — NEVER triggers push

    EventStatus:
      type: string
      enum: [needs_user, succeeded, failed]
      description: |
        Event outcome. May push for needs_user (always), or succeeded/failed
        with actions / force_push.

    SessionState:
      type: string
      enum:
        - open
        - running
        - needs_user
        - awaiting_confirm
        - queued
        - claimed
        - closed
        - expired

    ActionRisk:
      type: string
      enum: [low, medium, high, destructive]
      description: destructive (or confirm:true) requires second confirm (≤30m)

    ActionStatus:
      type: string
      enum:
        - offered
        - pending_confirm
        - awaiting_confirm
        - queued
        - claimed
        - done
        - failed
        - cancelled
        - expired

    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
        message: { type: string }
        details: { type: object, additionalProperties: true }

    AuthCredentials:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }

    AuthTokenResponse:
      type: object
      required: [user_id, token, refresh_token, expires_in]
      properties:
        user_id: { type: string }
        token: { type: string, description: JWT for UserBearer }
        refresh_token: { type: string, description: One-time-rotatable opaque token }
        expires_in: { type: integer, description: Access-token lifetime in seconds }

    Agent:
      type: object
      required: [agent_id, label, created_at]
      properties:
        agent_id: { type: string }
        label: { type: string }
        host_label: { type: ["string", "null"] }
        created_at: { type: string }
        last_seen_at: { type: ["string", "null"] }

    AgentCreated:
      type: object
      required: [agent, api_key]
      properties:
        agent:
          $ref: "#/components/schemas/Agent"
        api_key:
          type: string
          description: Shown only once; use as X-Agent-Key

    HistoryEntry:
      type: object
      required: [audit_id, action, created_at, metadata]
      properties:
        audit_id: { type: string }
        action: { type: string }
        session_id: { type: [string, "null"] }
        agent_id: { type: [string, "null"] }
        metadata: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }

    SkillActionDef:
      type: object
      required: [id, risk, confirm]
      properties:
        id: { type: string }
        risk:
          $ref: "#/components/schemas/ActionRisk"
        confirm: { type: boolean }
        title: { type: string }

    Skill:
      type: object
      required: [skill_id, template, facts_schema, actions, ttl]
      properties:
        skill_id: { type: string, examples: [deploy.result] }
        template:
          type: string
          examples: ["{{service}} 在 {{env}} 部署{{status}}"]
        facts_schema:
          type: array
          items: { type: string }
        actions:
          type: array
          items:
            $ref: "#/components/schemas/SkillActionDef"
        ttl:
          type: object
          required: [default_sec, destructive_sec]
          properties:
            default_sec:
              type: integer
              maximum: 86400
            destructive_sec:
              type: integer
              maximum: 1800
        version: { type: integer }

    Session:
      type: object
      required: [session_id, skill_id, state]
      properties:
        session_id: { type: string }
        user_id: { type: string }
        agent_id: { type: string }
        skill_id: { type: string }
        state:
          $ref: "#/components/schemas/SessionState"
        chat_id: { type: ["string", "null"] }
        title: { type: ["string", "null"] }
        progress_status:
          oneOf:
            - $ref: "#/components/schemas/ProgressStatus"
            - type: "null"
        progress_percent: { type: ["number", "null"], minimum: 0, maximum: 100 }
        progress_message: { type: ["string", "null"] }
        summary_text: { type: ["string", "null"] }
        voice_script:
          type: ["string", "null"]
          description: Summary truncated ~80 chars for voice
        available_actions:
          type: array
          items: { type: string }
        facts:
          type: object
          additionalProperties: true
        expires_at: { type: string }
        created_at: { type: string }
        updated_at: { type: string }

    ReportEventRequest:
      type: object
      required: [status, idempotency_key]
      additionalProperties: false
      properties:
        status:
          $ref: "#/components/schemas/EventStatus"
        idempotency_key: { type: string, minLength: 1 }
        summary: { type: string, maxLength: 280 }
        facts:
          type: object
          additionalProperties: true
        actions:
          type: array
          items: { type: string }
          description: Skill action ids (required for needs_user)
        force_push: { type: boolean }

    ReportEventResponse:
      type: object
      required: [event_id, pushed]
      properties:
        event_id: { type: string }
        session:
          $ref: "#/components/schemas/Session"
        pushed:
          type: boolean
          description: Whether a push was enqueued
        summary_text: { type: string }
        voice_script: { type: string }
        deduped: { type: boolean }

    Action:
      type: object
      required: [action_id, session_id, action_key, risk, status]
      properties:
        action_id: { type: string }
        session_id: { type: string }
        action_key: { type: string }
        title: { type: [string, "null"] }
        risk:
          $ref: "#/components/schemas/ActionRisk"
        confirm_required: { type: boolean }
        status:
          $ref: "#/components/schemas/ActionStatus"
        payload:
          type: object
          additionalProperties: true
        expires_at: { type: string }
        claimed_at: { type: ["string", "null"] }
        result:
          type: [object, "null"]
          additionalProperties: true
        cancelled_by_user: { type: boolean }

    PendingActionsResponse:
      type: object
      required: [actions]
      properties:
        actions:
          type: array
          items:
            $ref: "#/components/schemas/Action"

    Device:
      type: object
      required: [device_id, platform]
      properties:
        device_id: { type: string }
        platform: { type: string }
        push_token: { type: ["string", "null"] }
        locale: { type: string }

    PhoneActionResponse:
      type: object
      required: [session, action, needs_confirm]
      properties:
        session:
          $ref: "#/components/schemas/Session"
        action:
          $ref: "#/components/schemas/Action"
        needs_confirm: { type: boolean }

    DevPush:
      type: object
      required: [push_id, created_at]
      properties:
        push_id: { type: string }
        session_id: { type: string }
        title: { type: string }
        body: { type: string }
        voice_script: { type: string }
        created_at: { type: string }
